<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Pekárková · 2 návrhy webu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;padding:0;height:100%;background:#f0eee9;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif}
  .dc-frame{
    width:100%; height:100%; border:0; display:block;
    background:#1a1814;
  }
  .dc-frame--cream{background:#f6f1e8}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const ARTBOARD_W = 1440;
const ARTBOARD_H = 5400;

function VariantFrame({ src, themeClass }){
  return (
    <iframe
      className={"dc-frame " + (themeClass||"")}
      src={src}
      title={src}
      scrolling="yes"
      style={{width: ARTBOARD_W, height: ARTBOARD_H}}
    />
  );
}

function App(){
  return (
    <DesignCanvas>
      <DCSection
        id="varianty"
        title="2 varianty"
        subtitle="Stejný obsah, dvě atmosféry. Klikni na ⛶ pro fullscreen a scrolluj."
      >
        <DCArtboard
          id="dusk"
          label="A · Editorial Dusk — tmavá, luxusní"
          width={ARTBOARD_W}
          height={ARTBOARD_H}
        >
          <VariantFrame src="site/variant-dusk.html" themeClass="" />
        </DCArtboard>

        <DCArtboard
          id="cream"
          label="B · Atelier Cream — světlá, teplá"
          width={ARTBOARD_W}
          height={ARTBOARD_H}
        >
          <VariantFrame src="site/variant-cream.html" themeClass="dc-frame--cream" />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
